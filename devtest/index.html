<!doctype html>
<html><body>
<script>
// «Discord»: пересылает сообщения с задержкой (?delay=мс) и теряет долю (?loss=0..1).
// ?relay=turn:IP:PORT — у хоста свой TURN, зритель ТОЛЬКО relay и без своих TURN:
// видео пойдёт, лишь если хост передал TURN в оффере и путь реально через ретранслятор.
const q = new URLSearchParams(location.search);
const LOSS = Number(q.get("loss") || 0);
const DELAY = Number(q.get("delay") || 300);
const RELAY = q.get("relay") || "";
const frames = {};
for (const [id, role] of [["111111111111111111", "host"], ["222222222222222222", "viewer"]]) {
    const fr = document.createElement("iframe");
    fr.src = `peer.html?me=${id}&role=${role}&relay=${encodeURIComponent(RELAY)}${q.has("heavy") ? "&heavy" : ""}${q.get("bitrate") ? "&bitrate=" + q.get("bitrate") : ""}${q.get("codec") ? "&codec=" + q.get("codec") : ""}`;
    document.body.appendChild(fr);
    frames[id] = fr;
}
let sent = 0, dropped = 0;
window.addEventListener("message", e => {
    const m = e.data;
    if (m.kind === "send") {
        sent++;
        for (const [id, fr] of Object.entries(frames)) {
            if (id === m.from) continue;
            if (Math.random() < LOSS) { dropped++; console.log(`[discord] ПОТЕРЯНО сообщение от ${m.from.slice(0, 3)}`); continue; }
            setTimeout(() => fr.contentWindow.postMessage({ ...m, kind: "deliver" }, "*"), DELAY + Math.random() * DELAY);
        }
    } else if (m.kind === "log") {
        console.log(m.text);
    } else if (m.kind === "status") {
        console.log(`[status ${m.from.slice(0, 3)}] ${m.text}`);
        if (m.text.startsWith("OK") || m.text.startsWith("FAIL")) window.__result = `${m.text} | сообщений: ${sent}, потеряно: ${dropped}`;
    }
});
</script>
</body></html>
